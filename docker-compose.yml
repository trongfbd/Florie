services:
  postgres:
    image: postgres:16-alpine
    container_name: florie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-florie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-florie_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-florie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - florie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-florie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io, not Docker Hub's minio/minio -- MinIO Inc. restricted that repo
    # to require a paid login at some point after this file was written;
    # quay.io/minio/* remains freely public. Same for minio-init below.
    image: quay.io/minio/minio:latest
    container_name: florie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-florie_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-florie_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - florie_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: florie-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-florie_admin} ${MINIO_ROOT_PASSWORD:-florie_dev_password} &&
      (mc mb -p local/${MINIO_BUCKET:-florie-media} || true) &&
      mc anonymous set download local/${MINIO_BUCKET:-florie-media}
      "

volumes:
  florie_postgres_data:
  florie_minio_data:
