# Florie production reverse proxy — single VPS, path-based API routing on
# the main domain (florie.vn/api/... -> api container), a separate media
# subdomain in front of MinIO. See DEPLOYMENT.md for the full setup.
#
# TLS via certbot's webroot method. nginx refuses to even start a "listen
# ssl" block with no ssl_certificate configured, so DEPLOYMENT.md has you
# generate a throwaway self-signed cert at these exact paths *before* the
# first `docker compose up` — certbot then overwrites it with the real one
# once the ACME challenge succeeds, and a plain nginx restart picks it up
# (the paths never change, so the config below never needs editing).

# --- main app (web + api) ---
server {
    listen 80;
    server_name florie.vn www.florie.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name florie.vn www.florie.vn;

    ssl_certificate     /etc/letsencrypt/live/florie.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/florie.vn/privkey.pem;

    # Covers product image uploads (5MB limit, enforced again in the app)
    # and database restore uploads (grows with real data over time).
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pg_dump/restore and AI calls can run long — don't cut them off.
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- media (MinIO product/blog/banner images) ---
server {
    listen 80;
    server_name media.florie.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.florie.vn;

    ssl_certificate     /etc/letsencrypt/live/media.florie.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.florie.vn/privkey.pem;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
