# Local/free test reverse proxy — used with docker-compose.local-test.yml
# (DEPLOYMENT.md Section 0B) when there's no domain and a Cloudflare Tunnel
# terminates HTTPS in front of this. Plain HTTP on port 80 only, one host —
# no certbot, no SSL blocks, unlike nginx/florie.conf.
#
# Media is proxied under a /media/ path prefix (instead of florie.conf's
# separate media.florie.vn subdomain) since there's only one hostname
# available here. MINIO_PUBLIC_URL must be set to "<tunnel-url>/media" to
# match — see DEPLOYMENT.md Section 0B step 4.

server {
    listen 80;
    server_name _;

    # Covers product image uploads (5MB limit, enforced again in the app)
    # and database restore uploads (grows with real data over time).
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pg_dump/restore and AI calls can run long — don't cut them off.
        proxy_read_timeout 180s;
        # WebSocket upgrade for the notifications socket (server path
        # /api/socket.io/ — see notifications.gateway.ts) — harmless for
        # plain REST requests under this same location.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Strips the /media/ prefix — MinIO itself has no such prefix, it only
    # knows /<bucket>/<key>. proxy_pass with a bare trailing "/" (no path
    # component) replaces the matched location prefix with nothing.
    location /media/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
