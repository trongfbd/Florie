# Explicit project name so this stack's containers/volumes/network never
# collide with docker-compose.yml (dev) if both ever run on the same host —
# without this, both files default to the same name (the directory name)
# and would silently share/corrupt the same named volumes.
name: florie-prod

# IMPORTANT: every `docker compose` invocation against this file must
# include `--env-file .env.production`. Docker Compose only *auto*-loads a
# file literally named ".env" for ${...} substitution in this file (the
# POSTGRES_USER/MINIO_ROOT_PASSWORD/NEXT_PUBLIC_* vars below) — a
# differently-named file is silently ignored, resolving every ${...} to an
# empty string. `env_file: .env.production` on the api service below is a
# SEPARATE mechanism (injects the file's contents into that one container's
# runtime env) and does not cover this. See DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: florie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - florie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io, not Docker Hub's minio/minio -- MinIO Inc. restricted that repo
    # to require a paid login at some point after this file was written;
    # quay.io/minio/* remains freely public. Same for minio-init below.
    image: quay.io/minio/minio:latest
    container_name: florie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - florie_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: florie-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      (mc mb -p local/${MINIO_BUCKET} || true) &&
      mc anonymous set download local/${MINIO_BUCKET}
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: florie-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Composed here (not left to env_file) so the postgres/minio hostnames
      # always match the service names above, regardless of what's in
      # .env.production — everything else (secrets, keys) comes from the file.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        MEDIA_PUBLIC_HOSTNAME: ${MEDIA_PUBLIC_HOSTNAME}
    container_name: florie-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server-side fetches (SSR/ISR, run inside this container at request
      # time) should hit the api container directly over the Docker network
      # instead of looping back out through nginx/the public domain —
      # NEXT_PUBLIC_API_URL (baked into the browser bundle at build time)
      # stays the public https://florie.vn URL for client-side fetches.
      # See apps/web/src/lib/api-server.ts's API_BASE resolution.
      API_INTERNAL_URL: http://api:4000
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: florie-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/florie.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    container_name: florie-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # No entrypoint override here — run one-off commands via
    # `docker compose run --rm certbot certonly ...` per DEPLOYMENT.md,
    # rather than baking a specific domain/command into the service.

volumes:
  florie_postgres_data:
  florie_minio_data:
  certbot_www:
  certbot_certs:
